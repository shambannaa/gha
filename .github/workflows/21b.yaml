name: lesson21b
on:
  workflow_dispatch:
    inputs:
      title:
        type: string
        default: hello

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          TITLE: ${{ inputs.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^[A-Za-z0-9 _.-]+$'; then
            echo "::error::title has disallowed characters"
            exit 1
          fi
      - name: Safe
        env:
          TITLE: ${{ inputs.title }}
        run: |
          echo "Title: $TITLE"

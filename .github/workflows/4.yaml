name: lesson4
on: workflow_dispatch

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get
        uses: actions/checkout@v7

      - name: Verify checkout
        run: |
          ls -la
          test -f README.md
          git log --oneline

      - name: Build
        run: |
          mkdir -p build
          cp README.md build/
          echo "BUILD_ID=$(date +%s)" >> "$BUILD_ID"
          echo "built from $GITHUB_SHA" > build/version.txt

      - name: Verify build
        run: |
          ls -la build
          cat build/version.txt
          echo "id: $BUILD_ID"

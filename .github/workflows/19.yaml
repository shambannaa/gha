name: lesson19
on: workflow_dispatch

jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262              # a JavaScript action
      - uses: ./.github/actions/greet          # type: ???
        with:
          who: pinning
      - uses: docker://ubuntu:latest                # a Docker image
        with:
          entrypoint: /bin/echo
          args: hello from docker
      - name: See downloaded actions
        run: find /home/runner/work/_actions -maxdepth 3 -type d

name: lesson9
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: echo "step 1"
      - name: Fails on purpose
        run: exit 1
      - name: Step 3, no if
        run: echo "step 3"
      - name: On failure
        if: failure()
        run: echo "something failed earlier"
      - name: Cleanup
        if: ${{ !cancelled() }}
        run: echo "cleanup"
      - name: Only on main
        if: ${{ github.ref_name == 'main' && !cancelled() }}
        run: echo "main only"
  notify:
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "build job failed"

